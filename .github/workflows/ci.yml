# Every PR: leak scan, unit tests, and the e2e suites against the pinned release on Linux
# and macOS, plus the cpb install/update round trip on Linux.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Leak scan (gitleaks, full history)
        run: |
          set -euo pipefail
          v=8.21.2
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz$" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun test

  e2e:
    needs: [scan, unit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Convert the pinned release (fresh, rerun)
        run: bash playbook/tests/e2e.sh

  cpb:
    needs: [scan, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Install cpb
        run: |
          set -euo pipefail
          v=v4.1.0
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/ramazanpolat/claude-playbooks/releases/download/$v/cpb-linux-amd64"
          curl -fsSLO "https://github.com/ramazanpolat/claude-playbooks/releases/download/$v/SHA256SUMS"
          grep " cpb-linux-amd64$" SHA256SUMS | sha256sum -c -
          install -m 755 cpb-linux-amd64 /usr/local/bin/cpb
          cpb --version
      - name: cpb CREATE PLAYBOOK, convert, cpb update, session rebuild
        run: bash playbook/tests/cpb.sh
